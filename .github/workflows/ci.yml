# Runs on every push / pull request: build, unit tests, sanitizer build, Python tests.
name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libgtest-dev wget
      - name: Get ONNX Runtime
        run: ./tools/get_onnxruntime.sh
      - name: Build (Release, warnings on)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: C++ unit tests (GoogleTest via CTest)
        run: ctest --test-dir build --output-on-failure
      - name: Python tests (LLM report validator)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libgtest-dev wget
      - name: Get ONNX Runtime
        run: ./tools/get_onnxruntime.sh
      - name: Build with ASan + UBSan
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON && cmake --build build-asan -j
      - name: Unit tests under sanitizers
        run: ./build-asan/unit_tests
